version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: task_manager_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ElectroPiTask
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - task-network
    # Best Practice: healthcheck ensures dependents wait until MySQL is truly ready
    # (not just when the container starts, but when it can accept connections)
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: task_manager_server
    restart: always
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USERNAME=user
      - DB_PASSWORD=password
      - DB_NAME=ElectroPiTask
      - DB_SYNC=true
      - JWT_SECRET=super_secret_jwt_key_for_demo
      - JWT_EXPIRES_IN=7d
      - NODE_ENV=production
    # Best Practice: condition: service_healthy waits for the DB healthcheck to pass
    # before starting the server, preventing connection-refused errors on boot
    depends_on:
      db:
        condition: service_healthy
    networks:
      - task-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked in at BUILD time by Next.js
        - NEXT_PUBLIC_API_URL=http://localhost:3000/api
    container_name: task_manager_client
    restart: always
    ports:
      - '3001:3000'
    # Best Practice: wait for server container to start before the client
    depends_on:
      - server
    networks:
      - task-network

volumes:
  db_data:

networks:
  task-network:
    driver: bridge
